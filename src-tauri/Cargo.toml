[package]
name = "drvmatch"
version = "0.3.0"
description = "A conservative Windows driver manager focused on exact-machine suitability"
authors = ["DrvMatch contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "drvmatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "blocking",
  "charset",
  "form",
  "native-tls",
  "query",
  "system-proxy",
] }
scraper = "0.27.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Properties",
  "Win32_Foundation",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_SystemInformation",
] }
windows = { version = "0.62.2", features = [
  "Win32_System_Com",
  "Win32_System_UpdateAgent",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
